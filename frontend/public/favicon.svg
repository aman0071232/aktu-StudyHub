<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7046E8"/>
      <stop offset="100%" stop-color="#B15AC8"/>
    </linearGradient>

    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEE7FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    width="100"
    height="100"
    rx="24"
    fill="url(#bg)"
  />

  <!-- Graduation Cap -->
  <path
    d="M18 35 L50 20 L82 35 L50 50 Z"
    fill="#FFFFFF"
  />

  <!-- Cap Base -->
  <path
    d="M28 41 V52
       C28 60 40 66 50 66
       C60 66 72 60 72 52
       V41"
    fill="#EEE7FF"
  />

  <!-- Tassel -->
  <path
    d="M82 35 V52"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
  />

  <circle
    cx="82"
    cy="55"
    r="4"
    fill="#FFD76A"
  />

  <!-- Open Book -->
  <path
    d="M25 72
       C34 67 42 68 50 73
       C58 68 66 67 75 72
       V84
       C66 79 58 80 50 85
       C42 80 34 79 25 84 Z"
    fill="url(#book)"
  />

  <!-- Book Center -->
  <path
    d="M50 73 V85"
    stroke="#C7B8F4"
    stroke-width="2"
  />
</svg>